<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智农·慧眼 | 大田病虫害智能检测与预警平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/main.css?v=8">
<link rel="stylesheet" href="/static/css/glass-icons.css?v=5">
<link rel="stylesheet" href="/static/css/counter.css?v=5">

<body>

<div class="stage">
  <div class="bg" id="bg"></div>
  <div class="stage-vignette"></div>

  <!-- ================= 侧边栏 ================= -->
  <aside class="sidebar glass-panel">
    <div class="logo-wrap">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06251d" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 4h18v6H3z" rx="2"/>
          <path d="M7 4v6M12 4v6M17 4v6"/>
          <path d="M5 16h14M5 20h14"/>
          <path d="M12 16v4"/>
        </svg>
      </div>
      <div class="logo-text">智农·慧眼<small>PEST VISION</small></div>
    </div>

    <nav class="nav">
      <a class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>数据总览</span>
      </a>
      <a class="nav-item" data-page="statistics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-6"/></svg>
        <span>数据统计</span>
      </a>
      <a class="nav-item" data-page="warnings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span>预警中心</span>
        <span class="nav-badge hidden" id="navWarnBadge">0</span>
      </a>
      <a class="nav-item" data-page="knowledge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>农业知识库</span>
      </a>
      <a class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>系统设置</span>
      </a>
    </nav>

    <a class="nav-detect" data-page="detect">
      <span class="detect-ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>智能检测</span>
    </a>

    <div class="nav-foot">
      <div class="model-chip" id="modelChip"><i></i><span>模型加载中</span></div>
      <a class="nav-item" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>退出系统</span>
      </a>
    </div>
  </aside>

  <!-- ================= 主区域 ================= -->
  <div class="main">
    <header class="header glass-panel">
      <div class="hello">
        <div class="hello-title" id="pageTitle">数据总览</div>
        <div class="hello-sub" id="pageSub">大田病虫害智能检测与预警平台 · 边缘AI监测站</div>
      </div>
      <div class="tools">
        <div class="tool glass-chip clock" id="clock"></div>
        <div class="tool glass-chip weather" id="weatherChip" title="模拟环境数据">--</div>
        <button class="tool glass-chip" id="bellBtn" title="预警通知">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="tool-badge hidden" id="bellBadge">0</span>
        </button>
        <div class="tool avatar"><img src="/static/img/avatar.png" alt="用户"></div>
      </div>
    </header>

    <main class="content">
      <!-- 数据总览 -->
      <section class="page active" id="page-dashboard"></section>
      <!-- 数据统计 -->
      <section class="page" id="page-statistics"></section>
      <!-- 预警中心 -->
      <section class="page" id="page-warnings"></section>
      <!-- 农业知识库 -->
      <section class="page" id="page-knowledge"></section>
      <!-- 系统设置 -->
      <section class="page" id="page-settings"></section>
      <!-- 智能检测 -->
      <section class="page" id="page-detect"></section>
    </main>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- 弹窗 -->
<div class="modal-mask" id="modalMask"></div>

<script src="/static/vendor/echarts.min.js?v=5"></script>
<script src="/static/js/lib.js?v=5"></script>
<script src="/static/js/app.js?v=5"></script>
<script src="/static/js/dashboard.js?v=5"></script>
<script src="/static/js/statistics.js?v=5"></script>
<script src="/static/js/warnings.js?v=5"></script>
<script src="/static/js/knowledge.js?v=5"></script>
<script src="/static/js/settings.js?v=5"></script>
<script src="/static/js/detect.js?v=5"></script>
